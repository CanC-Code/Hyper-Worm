<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05010f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Hyper Worm — Neon Sphere</title>
<script>
(function(){
  window.__errors=[];
  function showErr(msg){
    window.__errors.push(msg);
    var el=document.getElementById("__err_panel");
    if(!el){
      el=document.createElement("pre");
      el.id="__err_panel";
      el.style.cssText="position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow:auto;background:rgba(160,0,0,.95);color:#fff;font:11px monospace;padding:10px;margin:0;z-index:99999;white-space:pre-wrap;border-top:2px solid #fff";
      document.body.appendChild(el);
    }
    el.textContent=window.__errors.join("\n\n");
  }
  window.addEventListener("error",function(e){
    var msg;
    if(e.target&&e.target.tagName){
      msg="RESOURCE: "+e.target.tagName+" "+(e.target.src||e.target.href||"");
    }else{
      msg="JS: "+(e.message||"error")+" @ "+(e.filename||"?")+":"+(e.lineno||0);
    }
    showErr(msg);
  },true);
  window.addEventListener("unhandledrejection",function(e){
    var r=e.reason;
    showErr("REJECT: "+(r&&(r.stack||r.message||r)));
  });
})();
</script>

<link rel="stylesheet" href="style/main.css" />
</head>
<body>
<canvas id="scene"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="stat"><b id="score">0</b><span>SCORE</span></div>
  <div class="stat"><b id="len">12</b><span>LENGTH</span></div>
  <div class="stat"><b id="best">0</b><span>BEST</span></div>
</div>

<div id="controls">
  <div class="stick-zone" id="stick-left">
    <div class="stick-base" id="stick-left-base">
      <div class="stick-knob" id="stick-left-knob"></div>
    </div>
    <span class="stick-label">STEER</span>
  </div>
  <div class="boost-slot">
    <button class="boost-btn" id="btn-boost" aria-label="boost">&#9889;</button>
  </div>
  <div class="stick-zone" id="stick-right">
    <div class="stick-base" id="stick-right-base">
      <div class="stick-knob" id="stick-right-knob"></div>
    </div>
    <span class="stick-label">ORBIT</span>
  </div>
</div>

<div id="overlay">
  <div class="panel">
    <h1>HYPER<span>WORM</span></h1>
    <p>Devour the neon orbs.<br>Don&rsquo;t bite your own tail.</p>
    <button id="ov-btn">START</button>
    <p class="hint">DRAG to orbit &middot; &#9664; &#9654; / A D to steer &middot; SHIFT or &#9889; turbo</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
